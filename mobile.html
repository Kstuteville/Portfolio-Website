<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Kaylie Stuteville - Portfolio</title>
    <style>
        /* Standalone mobile landing page.

           index.html's parallax scene pins every layer at a fixed pixel offset
           from centre (left: calc(50% + 520px) and similar), which cannot hold
           together at phone width. This page is a separate, self-contained
           still version - it shares no CSS with index.html, so nothing here can
           affect the desktop homepage. */

        @import url("https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap");

        @font-face {
            font-family: "Highwind";
            src: url("./fonts/Highwind.ttf") format("truetype");
            font-weight: normal;
            font-style: normal;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            background: #05070d;
            overflow-x: hidden;
        }

        .hero {
            position: relative;
            width: 100%;
            /* dvh, not vh: on iOS Safari the collapsing address bar makes 100vh
               taller than the visible area, which cuts the bottom off. */
            min-height: 100dvh;
            overflow: hidden;
        }

        .hero-art {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            /* the artwork is landscape (2048x1152); this keeps the hooded
               figure in frame when it's cropped to a portrait screen */
            object-fit: cover;
            object-position: 50% 38%;
        }

        .hero-scrim {
            position: absolute;
            inset: 0;
            background: linear-gradient(
                180deg,
                rgba(3, 6, 12, 0.74) 0%,
                rgba(3, 6, 12, 0.26) 32%,
                rgba(3, 6, 12, 0.70) 64%,
                rgba(3, 6, 12, 0.95) 100%
            );
        }

        .hero-inner {
            position: relative;
            z-index: 2;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: max(3rem, env(safe-area-inset-top) + 2rem) 1.5rem
                     max(2rem, env(safe-area-inset-bottom) + 1rem);
        }

        .hero-name {
            font-family: "Highwind", "Poppins", sans-serif;
            font-size: clamp(2.8rem, 16vw, 5rem);
            line-height: 1.02;
            letter-spacing: 0.05em;
            color: #fff;
            text-shadow: 0 4px 26px rgba(0, 0, 0, 0.9);
        }

        .hero-sub {
            font-family: "Poppins", sans-serif;
            font-size: 0.9rem;
            font-weight: 600;
            letter-spacing: 0.44em;
            text-transform: uppercase;
            color: #6ec9ff;
            margin-top: 0.9rem;
            text-shadow: 0 2px 14px rgba(0, 0, 0, 0.95);
        }

        .hero-nav {
            display: flex;
            flex-direction: column;
            gap: 0.55rem;
            margin-top: auto;
        }

        .hero-nav a {
            display: block;
            padding: 1rem 1.15rem;        /* comfortable tap target */
            font-family: "Poppins", sans-serif;
            font-size: 1rem;
            font-weight: 500;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            text-decoration: none;
            color: #fff;
            background: rgba(8, 12, 20, 0.6);
            border: 1px solid rgba(110, 201, 255, 0.4);
            -webkit-backdrop-filter: blur(6px);
            backdrop-filter: blur(6px);
        }

        .hero-desktop-link {
            display: block;
            margin-top: 1rem;
            text-align: center;
            font-family: "Poppins", sans-serif;
            font-size: 0.78rem;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.55);
            text-decoration: none;
        }

        .hero-nav a:active {
            background: rgba(110, 201, 255, 0.24);
            border-color: #6ec9ff;
        }

        /* On a wide screen this page still needs to look deliberate, since it
           can be opened on desktop directly. */
        @media (min-width: 820px) {
            .hero-inner {
                max-width: 620px;
                margin: 0 auto;
            }
            .hero-art { object-position: 50% 32%; }
        }
    </style>
</head>
<body>
    <div class="hero">
        <img class="hero-art" src="websitepngs/veilboundconceptart.jpg"
             alt="Veilbound concept art: a hooded figure in a snowbound graveyard">
        <div class="hero-scrim"></div>

        <div class="hero-inner">
            <div>
                <h1 class="hero-name">Kaylie<br>Stuteville</h1>
                <p class="hero-sub">Portfolio</p>
            </div>

            <nav class="hero-nav" aria-label="Site">
                <a href="about.html">About Me</a>
                <a href="experience.html">Experience</a>
                <a href="projects.html">Projects</a>
                <a href="prototypesandsystems.html">Prototypes</a>
                <a href="process.html">Design Process</a>
                <a href="contacts.html">Contact</a>
            </nav>

            <!-- ?desktop=1 sticks for the session, so index.html won't bounce
                 them straight back here. -->
            <a class="hero-desktop-link" href="index.html?desktop=1">View full site &rsaquo;</a>
        </div>
    </div>
</body>
</html>
