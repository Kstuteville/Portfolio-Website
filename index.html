    <!-- Small-screen routing. This is the ONLY addition to this page: it changes
         no markup, no CSS and no layout - it just sends narrow viewports to the
         still version, because the parallax below is built from layers pinned at
         fixed pixel offsets and cannot hold together at phone width.
         Placed before the stylesheet so a phone redirects before it starts
         downloading the artwork. -->
    <script>
    (function () {
        try {
            // ?desktop=1 lets anyone force the full site, and it sticks while
            // they browse, so a tablet user isn't locked out of the real page.
            if (location.search.indexOf('desktop=1') > -1) {
                sessionStorage.setItem('forceDesktop', '1');
            }
            if (sessionStorage.getItem('forceDesktop') === '1') return;

            // Width, not user-agent: UA sniffing misses Android, breaks on new
            // devices, and says nothing about the actual screen size.
            if (window.innerWidth <= 900) {
                // replace(), not href: otherwise index stays in history and the
                // Back button bounces straight back here and redirects again.
                location.replace('mobile.html');
            }
        } catch (e) {
            /* routing must never be able to break the page */
        }
    })();
    </script>

           dr-theme.css is intentionally NOT linked on this page — its main/body

<!-- Audio Element -->
<audio id="backgroundMusic" loop preload="auto">
    <source src="your-music-file.mp3" type="audio/mpeg">
    <source src="your-music-file.ogg" type="audio/ogg">
</audio>

<script>
// Music player functionality
const audio = document.getElementById('backgroundMusic');
const toggleBtn = document.getElementById('musicToggle');
const volumeSlider = document.getElementById('volumeSlider');

let isPlaying = false;

// Set initial volume (25%)
audio.volume = 0.25;

// Toggle play/pause
toggleBtn.addEventListener('click', () => {
    if (isPlaying) {
        audio.pause();
        toggleBtn.textContent = '▶️';
        isPlaying = false;
    } else {
        audio.play().catch(e => {
            console.log('Audio play prevented by browser policy');
        });
        toggleBtn.textContent = '⏸️';
        isPlaying = true;
    }
});

// Volume control
volumeSlider.addEventListener('input', (e) => {
    audio.volume = e.target.value / 100;
});

// Handle audio events
audio.addEventListener('canplay', () => {
    console.log('Audio ready to play');
});

audio.addEventListener('error', (e) => {
    console.error('Audio error:', e);
});
</script>
